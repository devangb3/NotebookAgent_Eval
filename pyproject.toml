[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dsbench-notebook-agent"
version = "0.1.0"
description = "Harbor-based DSBench harness for terminal-style data science agent evaluation."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "harbor>=0.1.45",
  "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.5",
]

[tool.setuptools]
py-modules = [
  "harbor_runner",
  "harbor_task_builder",
  "instruction_builder",
  "main",
  "task_loader",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
